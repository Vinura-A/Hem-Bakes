# =============================================================================
#  .github/workflows/sync-drive.yml
#  Hem Bakes – Google Drive Gallery Sync
# =============================================================================
#
#  WHAT THIS DOES:
#    1. Runs automatically every day at midnight Sydney time (2pm UTC)
#    2. Also runs whenever you push to the main branch
#    3. Can also be triggered manually at any time (see GitHub → Actions tab)
#
#    It connects to your Google Drive folder using a simple API key,
#    downloads any image files it finds, saves them to assets/gallery/,
#    regenerates gallery-data.js with the updated file list,
#    and commits + pushes the changes back to GitHub so your site updates.
#
#  GOOGLE DRIVE FOLDER:
#    https://drive.google.com/drive/folders/1PoOctAq1FhN186Q8sGyAe4IGspcekmmY
#
#  REQUIRED GITHUB SECRET (just one!):
#    GOOGLE_API_KEY  – A restricted Google Cloud API key with Drive API access.
#    See the deployment guide for exact setup steps.
#
# =============================================================================

name: Sync Google Drive Gallery

on:
  schedule:
    - cron: '0 14 * * *' # Runs daily
  workflow_dispatch: # Allows you to run it manually via the button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run sync script
        env:
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}
          DRIVE_FOLDER_ID: '1PoOctAq1FhN186Q8sGyAe4IGspcekmmY'
        run: |
          python .github/workflows/sync_drive.py